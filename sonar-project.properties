sonar.projectKey=cmiic_file-api
sonar.organization=cmiic
sonar.sourceEncoding=UTF-8

# Two Go modules, app/ (file-api) and pdf-sidecar/, with the Dockerfiles,
# workflows and docs around them. Sources and tests are told apart by Go's
# naming: every *_test.go is a test, everything else is source. Images are
# not source; the scanner would only try to read them as text.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/*.jpg,**/*.png

# Coverage is the two profiles the SonarQube Cloud workflow writes before the
# scan, one per module, with paths relative to this file (the workflow
# rewrites the app module's "file-api/" prefix to "app/"). Test files are
# tests, so they are never counted as uncovered source.
sonar.go.coverage.reportPaths=app/coverage.out,pdf-sidecar/coverage.out

# Every image is pinned as tag@sha256:digest on purpose: the tag tells
# Dependabot which release track to follow, and the digest makes the reviewed
# image immutable (README, "Dependency image pinning"). docker:S8431 asks for
# one or the other, which would give up either the updates or the immutability.
sonar.issue.ignore.multicriteria=tagAndDigest,ssrfDenyList,separateRunSteps
sonar.issue.ignore.multicriteria.tagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.tagAndDigest.resourceKey=**/Dockerfile

# go:S1313 is about hardcoding the addresses of hosts a program talks to. The
# literals in dialguard.go are the opposite: IANA special-purpose and private
# ranges in the SSRF deny list, refused rather than dialled. Only that file is
# exempt, so a hardcoded endpoint anywhere else is still reported.
sonar.issue.ignore.multicriteria.ssrfDenyList.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.ssrfDenyList.resourceKey=app/internal/util/dialguard.go

# docker:S7031 asks to merge consecutive RUN instructions. Creating the
# unprivileged user and installing packages are separate concerns, kept as
# separate steps for reading; merging them saves no measurable image size.
sonar.issue.ignore.multicriteria.separateRunSteps.ruleKey=docker:S7031
sonar.issue.ignore.multicriteria.separateRunSteps.resourceKey=**/Dockerfile
