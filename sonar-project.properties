sonar.projectKey=cmiic_file-api
sonar.organization=cmiic
sonar.sourceEncoding=UTF-8

# Two Go modules, app/ (file-api) and pdf-sidecar/, with the Dockerfiles,
# workflows and docs around them. Sources and tests are told apart by Go's
# naming: every *_test.go is a test, everything else is source.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go

# Coverage is the two profiles the SonarQube Cloud workflow writes before the
# scan, one per module, with paths relative to this file (the workflow
# rewrites the app module's "file-api/" prefix to "app/"). Test files are
# tests, so they are never counted as uncovered source.
sonar.go.coverage.reportPaths=app/coverage.out,pdf-sidecar/coverage.out
