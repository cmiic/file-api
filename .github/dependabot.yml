version: 2

updates:
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: daily
      time: "21:25"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
    groups:
      go-all:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /pdf-sidecar
    schedule:
      interval: daily
      time: "21:25"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
    groups:
      go-all:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "21:25"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    ignore:
      # Base-image major bumps get handled by hand; we still want digest
      # refreshes and any in-track tag changes to come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /pdf-sidecar
    schedule:
      interval: daily
      time: "21:25"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    ignore:
      # Base-image major bumps get handled by hand; we still want digest
      # refreshes and any in-track tag changes to come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: "21:25"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker-compose
    ignore:
      # Major bumps of pinned service/base images are handled by hand; digest
      # refreshes and in-track tag changes still come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: daily
      time: "21:25"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - devcontainers
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "21:25"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
