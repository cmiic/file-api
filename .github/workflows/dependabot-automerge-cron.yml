name: Dependabot Auto-merge (Cron)

on:
  schedule:
    # Run every 8 hours at 00:25, 08:25, and 16:25 UTC
    - cron: '25 0,8,16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-aged-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: cmiic/dependabot-automation/cron@6f33c1e895e189c532875d5ea279ba4322290823 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
