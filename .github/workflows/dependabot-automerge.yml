name: Dependabot Auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write # the cron step merges via the pull request merge endpoint
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: evaluate
        uses: cmiic/dependabot-automation/merge@6f33c1e895e189c532875d5ea279ba4322290823 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
          # Only these image repositories may auto-merge; list new base images here.
          trusted-images: docker.io/library/golang,docker.io/library/debian,docker.io/clamav/clamav,ghcr.io/cmiic/malware-scanner-api,ghcr.io/cmiic/media-screener-api
          allowed-ecosystems: github_actions,devcontainers,docker,docker_compose

      - if: steps.evaluate.outputs.candidate == 'true' && steps.evaluate.outputs.quarantine-passed == 'true'
        uses: cmiic/dependabot-automation/cron@6f33c1e895e189c532875d5ea279ba4322290823 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
