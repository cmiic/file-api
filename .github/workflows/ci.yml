name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            app/go.sum
            pdf-sidecar/go.sum

      - name: Vet app
        working-directory: app
        run: go vet ./...

      - name: Vet pdf-sidecar
        working-directory: pdf-sidecar
        run: go vet ./...

      # markdownlint-cli2 through its author's action, pinned by commit: CI runs
      # no npm install, so no unlocked dependency tree and no lifecycle scripts,
      # and Dependabot keeps the pin current. The action's globs default to the
      # repository root only, so they repeat the config's; its ignores still apply.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            app/go.sum
            pdf-sidecar/go.sum

      - name: Build app
        working-directory: app
        run: go build -v ./...

      - name: Test app
        working-directory: app
        run: go test -v ./...

      - name: Build pdf-sidecar
        working-directory: pdf-sidecar
        run: go build -v ./...

      - name: Test pdf-sidecar
        working-directory: pdf-sidecar
        run: go test -v ./...

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build Docker image
        run: docker build -t file-api:${{ github.sha }} .

      - name: Build PDF sidecar image
        run: docker build -t file-api-pdf-sidecar:${{ github.sha }} ./pdf-sidecar

      - name: Start container
        run: |
          docker run -d --name test-api \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e BASE_PATH=/tmp/files \
            -p 8080:8080 \
            file-api:${{ github.sha }}
          sleep 5

      - name: Start PDF sidecar container
        run: |
          docker run -d --name test-pdf-sidecar \
            -p 8082:8080 \
            file-api-pdf-sidecar:${{ github.sha }}
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:8080/health
          curl -f http://localhost:8082/health

      - name: Stop containers
        if: always()
        run: docker stop test-api test-pdf-sidecar || true
