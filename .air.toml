root = "."
tmp_dir = "tmp"

[build]
  entrypoint = "./tmp/main"
  cmd = "cd app && go build -o ../tmp/main ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "data"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  stop_on_error = true

[log]
  time = true

[screen]
  clear_on_rebuild = true