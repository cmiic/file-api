openapi: "3.0.2"
info:
  title: File Storage API
  description: >-
    High-performance file storage API with JWT authentication and on-demand image resizing via imgproxy.
    <br><br>
    **Authentication:** All write operations and private file access require a JWT token, passed either via
    `Authorization: Bearer {token}` header or `jwt_token` cookie. A trusted client application issues the
    token using the same secret configured for File API.
    <br><br>
    **Public vs Private:** Files under `/files/cli/{CLI_CODE}/` are private and require JWT. All other
    `/files/` paths are public.
    <br><br>
    **Image Resizing:** Use `/files-rs/` endpoints for on-demand resizing via imgproxy. Original files
    are stored once; thumbnails are generated on request.
    <br><br>
    **Deletion:** Off by default. When the operator sets `DELETE_MAX_AGE` or `DELETE_MAX_AGE_PRIVATE`,
    `DELETE /files/...` removes a file within that window for a token carrying the `delete` scope and a
    `delete_path` claim naming exactly that file. The window is a duration or `unlimited`. Files outside it,
    and all files of a class with no window, cannot be deleted through the API.
  version: "4.0"
  contact:
    name: Christoph Stadlbauer
    email: c@miic.at
  license:
    name: MIT license
servers:
  - url: http://file-api:8080/
    description: Internal container network
  - url: https://your-domain.tld/
    description: Production server (via Edge Nginx)
  - url: http://localhost:8080/
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT token with claims `cli_code` (for private files) and `scopes`. Scopes in use are `upload` for uploads and
        URL fetches, `delete` for the opt-in delete endpoint, and `scan:read` for scan metadata. A `delete` token also
        needs a `delete_path` claim holding the path of the one file it may remove, as an upload returned it in
        `orig.name`. The token must carry an `exp` claim; a token without an expiry is rejected as unauthorized.
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt_token
      description: JWT token as cookie (alternative to Bearer header)
  responses:
    UnauthorizedError:
      description: JWT token is missing, invalid, or lacks required scope
    ForbiddenError:
      description: JWT token does not grant access to the requested resource
    BadRequest:
      description: Invalid request - check response body for error message
    NotFound:
      description: File not found
    DeleteDisabled:
      description: Deletion is not enabled for this class of file on this deployment
    Deleted:
      description: File removed. Reverse-proxy and imgproxy caches are not purged and may keep serving it until their validity runs out.
    FetchFormTooLarge:
      description: The request body, which carries only the optional dimension fields, exceeds 64 KiB
    FileTooLarge:
      description: File exceeds maximum upload size (200MB)
  parameters:
    cli_code:
      in: path
      name: CLI_CODE
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]+$"
        maxLength: 16
      required: true
      description: Unique alphanumeric identifier for the client
    relative_file_path:
      in: path
      name: relative_file_path
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_/.-]+$"
        maxLength: 250
      required: true
      description: File path relative to storage root (e.g., `2025/01/abc123.jpg`)
  schemas:
    OrigInfo:
      description: Information about the stored file
      type: object
      required:
        - name
        - size
      properties:
        name:
          type: string
          description: Relative path to the stored file
          example: "2025/01/IMG_6060-fd117197340be1b7f5c6313c1af5369063555d32.jpg"
        size:
          type: integer
          format: int64
          description: File size in bytes
          example: 446892
        orig_width:
          type: integer
          description: Original image width in pixels (from client, null for non-images)
          example: 4032
        orig_height:
          type: integer
          description: Original image height in pixels (from client, null for non-images)
          example: 3024
        thumb_width:
          type: integer
          description: Custom thumbnail width (if user specified)
          example: 300
        thumb_height:
          type: integer
          description: Custom thumbnail height (if user specified)
          example: 200
    UploadResponse:
      type: object
      required:
        - orig
      properties:
        orig:
          $ref: "#/components/schemas/OrigInfo"
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"

paths:
  /health:
    get:
      summary: Health check
      description: Returns service health status
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /files/{relative_file_path}:
    parameters:
      - $ref: "#/components/parameters/relative_file_path"
    get:
      summary: Get public file
      description: >-
        Retrieve a publicly accessible file. Files not under `/cli/` path are public and require no authentication.
        Returns the raw file with appropriate Content-Type header.
      tags:
        - Files
      responses:
        "200":
          description: File content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete public file
      description: >-
        Remove a public file. Requires JWT with `delete` scope and a `delete_path` claim equal to the file's path, and
        the file must be within the deployment's `DELETE_MAX_AGE`, measured from its first upload; `unlimited` allows
        any age. A token for another file answers `403` with the body `Forbidden: token is not bound to this file`, and
        an older file answers `403` with the body `Forbidden: deletion window elapsed`. Deployments without
        `DELETE_MAX_AGE` do not allow this operation and answer `405`; if `DELETE_MAX_AGE_PRIVATE` is set, a request
        without a valid token still answers `401` and one without the `delete` scope answers `403`.
      tags:
        - Files
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          $ref: "#/components/responses/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/DeleteDisabled"

  /files/cli/{CLI_CODE}/{relative_file_path}:
    parameters:
      - $ref: "#/components/parameters/cli_code"
      - $ref: "#/components/parameters/relative_file_path"
    get:
      summary: Get private file
      description: >-
        Retrieve a file belonging to a specific client. Requires JWT authentication with matching `cli_code` claim.
        The response includes `Cache-Control: private` header to prevent edge caching.
      tags:
        - Files
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: File content
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, no-store"
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete private file
      description: >-
        Remove a private file. Requires JWT with `delete` scope, a `cli_code` claim matching the path, and a
        `delete_path` claim equal to the file's path, starting with `cli/`. The file must be within the deployment's
        `DELETE_MAX_AGE_PRIVATE`, or `DELETE_MAX_AGE` when that is unset, measured from its first upload; `unlimited`
        allows any age. A foreign client code, a token for another file or an elapsed window answers `403`. Deployments
        with neither variable set do not register this operation and answer `405`.
      tags:
        - Files
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          $ref: "#/components/responses/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/DeleteDisabled"

  /file-upload:
    post:
      summary: Upload public file
      description: >-
        Upload a file to public storage. Requires JWT with `upload` scope.
        The file is stored with SHA1-based deduplication. Optional dimension fields are passed through
        to the response for client-side use.
      tags:
        - Upload
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                orig_width:
                  type: integer
                  description: Original image width (extracted client-side)
                orig_height:
                  type: integer
                  description: Original image height (extracted client-side)
                thumb_width:
                  type: integer
                  description: Custom thumbnail width
                thumb_height:
                  type: integer
                  description: Custom thumbnail height
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "413":
          $ref: "#/components/responses/FileTooLarge"

  /file-upload/cli/{CLI_CODE}:
    parameters:
      - $ref: "#/components/parameters/cli_code"
    post:
      summary: Upload private file
      description: >-
        Upload a file to a client's private storage. Requires JWT with `upload` scope and matching `cli_code` claim.
        Files are stored under `/files/cli/{CLI_CODE}/YYYY/MM/` path structure.
      tags:
        - Upload
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                orig_width:
                  type: integer
                  description: Original image width (extracted client-side)
                orig_height:
                  type: integer
                  description: Original image height (extracted client-side)
                thumb_width:
                  type: integer
                  description: Custom thumbnail width
                thumb_height:
                  type: integer
                  description: Custom thumbnail height
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "413":
          $ref: "#/components/responses/FileTooLarge"

  /file-resize/url/{url}:
    parameters:
      - in: path
        name: url
        schema:
          type: string
        required: true
        description: URL-encoded source URL to fetch
    post:
      summary: Fetch and store public file from URL
      description: >-
        Fetch a file from a remote URL and store it in public storage. Requires JWT with `upload` scope.
        The `://` in URLs may be collapsed to `:/` by proxies; the API handles this automatically.
      tags:
        - Upload
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                orig_width:
                  type: integer
                orig_height:
                  type: integer
                thumb_width:
                  type: integer
                thumb_height:
                  type: integer
      responses:
        "200":
          description: File fetched and stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "413":
          $ref: "#/components/responses/FetchFormTooLarge"

  /file-resize/cli/{CLI_CODE}/url/{url}:
    parameters:
      - $ref: "#/components/parameters/cli_code"
      - in: path
        name: url
        schema:
          type: string
        required: true
        description: URL-encoded source URL to fetch
    post:
      summary: Fetch and store private file from URL
      description: >-
        Fetch a file from a remote URL and store it in a client's private storage. 
        Requires JWT with `upload` scope and matching `cli_code` claim.
      tags:
        - Upload
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                orig_width:
                  type: integer
                orig_height:
                  type: integer
                thumb_width:
                  type: integer
                thumb_height:
                  type: integer
      responses:
        "200":
          description: File fetched and stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "413":
          $ref: "#/components/responses/FetchFormTooLarge"

tags:
  - name: System
    description: Health and status endpoints
  - name: Files
    description: File retrieval and deletion endpoints
  - name: Upload
    description: File upload and URL fetch endpoints
